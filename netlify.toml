[build]
  command = "npm run build"
  publish = "dist"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"

[[headers]]
  for = "/(splash.jpg|pwa-*|*.png|*.svg|*.ico)"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
